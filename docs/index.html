<style>
/* Layout: scoreboard on top, one working column on the left, the pitch on the right. Colour blocks: each box has its own colour. */
:root{color-scheme:dark;
 --ink:#0B0B0C;--white:#FFFFFF;

html[lang="hi"] body,html[lang="ar"] body{line-height:1.65}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--page-fg);font:15px/1.5 var(--body);padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}

.score{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;direction:ltr}
.team{font:var(--dw) clamp(calc(20px*var(--k)),calc(3.4vw*var(--k)),calc(36px*var(--k)))/1.05 var(--disp);text-transform:uppercase;min-width:0;overflow-wrap:break-word}

.tape{display:grid;gap:7px;max-width:640px;width:100%;margin-inline:auto;direction:ltr}

.tab[aria-selected="true"]{background:var(--lime);color:var(--ink);border-color:var(--lime)}

.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:var(--gap);align-items:start}

.panel.pitchp{position:sticky;top:12px;padding:0;overflow:hidden}

.eyebrow{font:800 11px var(--body);letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.headline{font:var(--dw) clamp(calc(22px*var(--k)),calc(3.2vw*var(--k)),calc(34px*var(--k)))/1.08 var(--disp);text-transform:uppercase;margin:10px 0 12px;text-wrap:balance}
.sent{display:block;width:100%;text-align:start;background:var(--soft);border:2px solid var(--ink);border-radius:12px;padding:10px 12px;margin:8px 0 0;color:var(--ink)}

.note{font-size:13px;opacity:.75;margin:12px 0 0}

.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}

.pitchsvg{display:block;width:100%;height:auto;max-height:520px;direction:ltr}

.step{display:flex;gap:6px;align-items:center;direction:ltr}

.step button:disabled{opacity:.35}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font:600 12px var(--body);padding:8px 14px;background:var(--ink);color:#fff}

.stat span{font-size:13px;font-weight:600}
.rows{display:grid;gap:8px;margin-top:8px}
.rw{display:grid;grid-template-columns:minmax(120px,1fr) 3fr auto;gap:10px;align-items:center;font:700 13px var(--body)}
.rw .bar{height:14px;border:2px solid var(--ink);background:#fff}.rw .bar i{left:0;right:auto;background:var(--ink)}
.ptw{overflow-x:auto;margin-top:6px}.pt{width:100%;border-collapse:collapse;font-size:13.5px}.pt th{text-align:start;font:800 11px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px 6px 0;white-space:nowrap;opacity:.8}.pt td{padding:7px 10px 7px 0;border-bottom:1px solid #8884;white-space:nowrap}.pt td:first-child{font-weight:800}.pt td:not(:first-child),.pt th:not(:first-child){text-align:end}
.agents{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.agents li{display:grid;grid-template-columns:8em 1fr;gap:10px;padding:8px 10px;background:var(--soft);border:2px solid var(--ink);border-radius:10px;font-size:13.5px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
@media(max-width:900px){.two{grid-template-columns:1fr}}

.vb.ok{background:var(--mint)}.vb.no{background:var(--coral)}.vb.warn{background:var(--amber)}

.tw{overflow-x:auto}

th{font:800 11px var(--body);letter-spacing:.1em;text-transform:uppercase}

.fail{padding:24px;font-weight:700}

.board .num{color:var(--lime)}.board small{color:#9aa3ab}.board .bar{background:#ffffff26}.board .bar.l i{background:var(--lime)}.board .bar.r i{background:#fff;box-shadow:none}.board .tr b,.board .tr span{color:#fff}

<script>

/* ---------- loading ---------- */
async function loadWeek(n){

}
async function setLang(code){
  const meta=LANGS.find(l=>l[0]===code)||LANGS[0];code=meta[0];
  if(FONTS[code]&&!document.getElementById("f_"+code)){const l=document.createElement("link");l.id="f_"+code;l.rel="stylesheet";l.href="https://fonts.googleapis.com/css2?family="+FONTS[code]+"&display=swap";document.head.appendChild(l)}

/* ---------- text ---------- */
function sentText(i){const tr=TR();return tr&&tr.s&&tr.s[i]!=null?tr.s[i]:EN().sentences[i].text}
function headline(){const tr=TR();return tr&&tr.h?tr.h:EN().headline}
function askSents(qi){const e=EN().ask[qi],tr=TR();const a=tr&&tr.a&&tr.a[qi];
  if(e.status==="answered"&&e.sentences.length)return e.sentences.map((s,i)=>({text:Array.isArray(a)&&a[i]!=null?a[i]:s.text,ids:(s.receipts||[]).length>5?[]:(s.receipts||[])}));
  return[{text:typeof a==="string"?a:e.answer,ids:[]}]}
const SPATIAL=new Set(["goal","score_after","big_chance","injury","why"]);
function recapIds(i){const m=M(),s=EN().sentences[i];const out=[];for(const f of s.fact_ids||[]){const fa=fact(f);if(fa&&SPATIAL.has(fa.kind))for(const e of fa.events)if(!out.includes(e))out.push(e)}return out}
function timelineText(x){const o={team:x.team,player:x.player||"",score:x.score||"",replaced:x.replaced||"",secs:x.secs||"",frm:x.frm||"",to:x.to||""};
  const k={goal:"tl_goal",card:"tl_card",sub:x.reason==="injury"?"tl_sub_injury":"tl_sub",injury:"tl_injury_"+x.out,big_chance_missed:"tl_big_"+x.outcome,spell:"tl_spell"}[x.kind];return t(k,o)}
const kindName=x=>t({goal:"tl_goal_kind",card:"tl_card_kind",sub:"tl_sub_kind",injury:"tl_injury_kind",big_chance_missed:"tl_big_kind",spell:"tl_spell_kind"}[x.kind]);

/* ---------- events and pitch ---------- */
const EVC={};function evMap(m){if(EVC[m.id])return EVC[m.id];const by=new Map(),poss=new Map(),all=[];
  for(const r of m.events){const e={};m.cols.forEach((k,i)=>e[k]=r[i]);e.t=e.minute+e.second/60;by.set(e.id,e);all.push(e);if(e.possession!=null){if(!poss.has(e.possession))poss.set(e.possession,[]);poss.get(e.possession).push(e)}}
  return EVC[m.id]={by,poss,all}}
/* every team's own coordinates run towards its goal at 100; the away team is mirrored so the home side always attacks right */
const GX=e=>(e.side==="home"?e.x:100-e.x)*1.05, GY=e=>(e.side==="home"?e.y:100-e.y)*.68;
const GEX=e=>(e.side==="home"?e.end_x:100-e.end_x)*1.05, GEY=e=>(e.side==="home"?e.end_y:100-e.end_y)*.68;
const CHAIN=new Set(["pass","dribble","corner","free_kick","goal_kick"]);
function moments(m,ids){const {by}=evMap(m);const seen=new Set(),out=[];const evs=ids.map(i=>by.get(i)).filter(Boolean).sort((a,b)=>a.id-b.id);
  for(const e of evs){
    let shot=null;
    if(e.type==="goal"){shot=by.get(e.id-1);if(!shot||shot.type!=="shot"||shot.player!==e.player)shot=e}
    else if(e.type==="shot")shot=e;
    else if(e.type==="save"||e.type==="block"){const p=by.get(e.id-1);if(p&&p.type==="shot")shot=p}
    if(shot){if(e.type==="shot"){const nx=by.get(e.id+1);if(nx&&nx.type==="goal"&&nx.player===e.player)continue}
      if(seen.has(shot.id))continue;seen.add(shot.id);out.push({kind:"shot",shot});continue}
    if(e.x==null||seen.has(e.id))continue;seen.add(e.id);out.push({kind:"single",e})}
  const sing=out.filter(o=>o.kind==="single");
  if(sing.length>2){const g=new Map();for(const o of sing){if(!g.has(o.e.player))g.set(o.e.player,[]);g.get(o.e.player).push(o.e)}
    const grp=[...g.values()].slice(0,6).map(es=>es.length>1?{kind:"multi",es:es.slice(0,10)}:{kind:"single",e:es[0]});
    const fid=o=>o.kind==="shot"?o.shot.id:o.kind==="multi"?o.es[0].id:o.e.id;
    return out.filter(o=>o.kind==="shot").concat(grp).sort((x,y)=>fid(x)-fid(y)).slice(0,10)}
  return out.slice(0,10)}
function lines(){return`<g fill="none" stroke="#fff" stroke-opacity=".5" stroke-width=".25"><rect x="0" y="0" width="105" height="68"/><path d="M52.5 0V68"/><circle cx="52.5" cy="34" r="9.15"/><rect x="0" y="13.84" width="16.5" height="40.32"/><rect x="88.5" y="13.84" width="16.5" height="40.32"/><rect x="0" y="24.84" width="5.5" height="18.32"/><rect x="99.5" y="24.84" width="5.5" height="18.32"/><path d="M16.5 26.7a9.15 9.15 0 0 1 0 14.6M88.5 26.7a9.15 9.15 0 0 0 0 14.6"/></g><g fill="#fff" fill-opacity=".6"><circle cx="52.5" cy="34" r=".35"/><circle cx="11" cy="34" r=".35"/><circle cx="94" cy="34" r=".35"/></g>`}
const DEFS=`<defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto"><path d="M0 1L10 5L0 9z" fill="#fff"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto"><path d="M0 1L10 5L0 9z" fill="#D4FF3A"/></marker></defs>`;
const TEAMC=side=>side==="home"?"#D4FF3A":"#62B6FF";
function marker(e,num,label,r=1.7,x=GX(e),y=GY(e),vx0,vx1){const an=x>vx1-9?"end":x<vx0+9?"start":"middle",dx=an==="end"?2.4:an==="start"?-2.4:0;
  return`<g transform="translate(${x.toFixed(2)} ${y.toFixed(2)})"><circle r="${r}" fill="${TEAMC(e.side)}" stroke="#0B0B0C" stroke-width=".28"/><text y=".55" font-family="Archivo Black,Arial Black,sans-serif" font-size="1.55" text-anchor="middle" fill="#0B0B0C">${num||""}</text>${label?`<text x="${dx}" y="${y<7?4.1:-2.7}" font-family="Figtree,sans-serif" font-weight="800" font-size="1.7" text-anchor="${an}" fill="#fff" stroke="#0B0B0C" stroke-width=".32" paint-order="stroke">${esc(sur(e.player))}</text>`:""}</g>`}
function build(m,mo){const {poss}=evMap(m);let shot=null,pts=[];
  if(mo.kind==="shot"){shot=mo.shot;pts=(poss.get(shot.possession)||[]).filter(e=>e.id<shot.id&&CHAIN.has(e.type)&&e.side===shot.side&&e.x!=null&&!(e.type==="pass"&&e.outcome&&!/^complete/.test(e.outcome))).slice(-3);pts.push(shot)}
  else if(mo.kind==="multi")pts=mo.es;else pts=[mo.e];
  return{pts,shot}}
function pitchSVG(m,mo){const {pts,shot}=build(m,mo);const dir=pts[0].side==="home"?1:-1;let tgt=null,mark="";
  if(shot){const gx=dir>0?105:0,sx=GX(shot),sy=GY(shot);let ty=34+((shot.id*7)%9-4)*.5;
    if(shot.outcome==="off_target"){ty=sy>34?34+6.2:34-6.2;mark="off"}
    if(shot.outcome==="blocked"){tgt={x:sx+(gx-sx)*.55,y:sy+(34-sy)*.55};mark="blk"}else tgt={x:gx,y:ty}}
  const single=!shot,ps=pts.map(e=>[GX(e),GY(e)]).concat(tgt?[[tgt.x,tgt.y]]:[]);
  let x0=Math.min(...ps.map(q=>q[0])),x1=Math.max(...ps.map(q=>q[0])),y0=Math.min(...ps.map(q=>q[1])),y1=Math.max(...ps.map(q=>q[1]));
  const padx=single?20:8,pady=single?14:8;x0-=padx;x1+=padx;y0-=pady;y1+=pady;
  let w=Math.max(x1-x0,single?52:36),h=Math.max(y1-y0,single?36:26);const ar=1.55;if(w/h<ar)w=h*ar;else h=w/ar;
  let cx=(x0+x1)/2,cy=(y0+y1)/2;cx=Math.min(Math.max(cx,-2+w/2),107-w/2);cy=Math.min(Math.max(cy,-2+h/2),70-h/2);if(w>109){w=109;cx=52.5}if(h>72){h=72;cy=34}
  const vb=[cx-w/2,cy-h/2,w,h].map(n=>n.toFixed(1)),vx0=+vb[0],vx1=+vb[0]+ +vb[2];
  let s=`<svg class="pitchsvg" viewBox="${vb.join(" ")}" role="img" aria-label="${esc(t("pitch_label"))}">${DEFS}<rect x="-10" y="-10" width="130" height="90" fill="#17643B"/>${lines()}`;
  if(shot)s+=`<rect x="${dir>0?105:-1}" y="30.34" width="1" height="7.32" fill="#D4FF3A" fill-opacity=".9"/>`;
  if(mo.kind!=="multi")for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];if(!["pass","corner","free_kick","goal_kick","dribble"].includes(a.type))continue;
    const ex=a.end_x!=null?GEX(a):GX(b),ey=a.end_x!=null?GEY(a):GY(b);
    s+=`<path d="M${GX(a).toFixed(1)} ${GY(a).toFixed(1)}L${ex.toFixed(1)} ${ey.toFixed(1)}" stroke="#fff" stroke-opacity=".9" stroke-width=".32" ${a.type==="dribble"?'stroke-dasharray=".5 .9" stroke-linecap="round"':""} marker-end="url(#ah)" fill="none"/>`}
  const sv=shot&&shot.outcome==="saved"?evMap(m).by.get(shot.id+1):null;const gk=sv&&sv.type==="save"?sv:null;
  if(shot){s+=`<path d="M${GX(shot).toFixed(1)} ${GY(shot).toFixed(1)}L${tgt.x.toFixed(1)} ${tgt.y.toFixed(1)}" stroke="#D4FF3A" stroke-width=".42" stroke-dasharray="1.1 .8" ${mark==="blk"?"":'marker-end="url(#ah2)"'} fill="none"/>`;
    if(mark==="blk")s+=`<path d="M${tgt.x-.8} ${tgt.y-.8}l1.6 1.6m0-1.6l-1.6 1.6" stroke="#D4FF3A" stroke-width=".4"/>`}
  const lab=new Set();let prev=null;
  pts.forEach(e=>{const isShot=shot&&e===shot,big=mo.kind==="multi"?e===pts[0]:(isShot||e.player!==prev);prev=e.player;
    if(big){const sl=isShot||(!lab.has(e.player)&&!(shot&&e.player===shot.player));lab.add(e.player);s+=marker(e,m.shirts[e.player],sl,isShot?1.9:1.6,GX(e),GY(e),vx0,vx1)}
    else s+=`<circle cx="${GX(e).toFixed(1)}" cy="${GY(e).toFixed(1)}" r=".75" fill="${TEAMC(e.side)}" stroke="#0B0B0C" stroke-width=".2"/>`});
  if(gk&&tgt)s+=marker(gk,m.shirts[gk.player],true,1.6,tgt.x+(dir>0?-1.8:1.8),tgt.y,vx0,vx1);
  return{svg:s+"</svg>",shot,min:Math.floor(pts[pts.length-1].minute)+1}}
function legendHTML(){const m=M();return`<div class="legend"><span><i class="dot" style="background:#D4FF3A"></i>${esc(t("legend_home",{team:m.home}))}</span><span><i class="dot" style="background:#62B6FF"></i>${esc(t("legend_away",{team:m.away}))}</span></div>`}
function evidenceHTML(){const m=M();const ids=S.sel&&S.sel.ids||[];const mos=ids.length?moments(m,ids):[];
  if(!mos.length)return`<div class="pmsg" style="background:#17643B">${esc(S.sel?(ids.length?t("ev_noloc"):t("ev_none")):t("tap_sentence"))}</div>`+legendHTML();
  const i=Math.min(S.mom,mos.length-1),mo=mos[i],p=pitchSVG(m,mo),o=p.shot?({goal:"ev_goal",saved:"ev_saved",blocked:"ev_blocked",off_target:"ev_off"}[p.shot.outcome]||"ev_shot"):null;
  const stp=mos.length>1?`<span class="step"><button data-mom="${i-1}" ${i?"":"disabled"} aria-label="${esc(t("prev"))}">‹</button><span>${i+1} / ${mos.length}</span><button data-mom="${i+1}" ${i<mos.length-1?"":"disabled"} aria-label="${esc(t("next"))}">›</button></span>`:"";
  return p.svg+`<div class="pcap"><span>${esc(t("ev_title"))} · ${esc(t("ev_min",{n:p.min}))}${o?" · "+esc(t(o)):""}</span>${stp}</div>`+legendHTML()}
function setEvidence(){const el=$("#pv");if(el)el.innerHTML=evidenceHTML()}

/* ---------- ball ---------- */
function ballSVG(){const P=(r,a,cx=0,cy=0)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)],f=n=>n.toFixed(2);
  const pent=(r,rot,cx,cy)=>[0,1,2,3,4].map(k=>P(r,rot+k*Math.PI*2/5,cx,cy).map(f).join(",")).join(" ");
  let s='<svg viewBox="-20 -20 40 40" aria-hidden="true"><defs><clipPath id="bc"><circle r="18.2"/></clipPath></defs><circle r="18.5" fill="#fff"/><g clip-path="url(#bc)">';
  s+=`<polygon points="${pent(6.4,-Math.PI/2,0,0)}" fill="#0B0B0C"/>`;
  for(let k=0;k<5;k++){const a=-Math.PI/2+k*Math.PI*2/5,[x1,y1]=P(6.4,a),[x2,y2]=P(12.4,a),[cx,cy]=P(18.4,a);
    s+=`<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="#0B0B0C" stroke-width="1.6"/><polygon points="${pent(6.6,a+Math.PI,cx,cy)}" fill="#0B0B0C"/>`}
  return s+'</g><circle r="18.2" fill="none" stroke="#0B0B0C" stroke-width="1.8"/></svg>'}

  <nav class="tabs" role="tablist">${["recap","replay","ask","table","trust"].map(k=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${esc(t(k==="table"?"table":k==="trust"?"tab_check":"tab_"+k))}</button>`).join("")}</nav>

/* ---------- club identity + player cards ---------- */
const CLUBC=["#E4002B","#00A3E0","#FF6A13","#8B5CF6","#00C389","#FFB81C","#E6007E","#2D7DD2","#FF4D4D","#00B2A9","#F26B3A","#6C8CFF","#3DDC84","#FF3D7F","#1FB5E8","#D1A300"];

const initials=n=>n.split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();

function viewRecap(){const en=EN(),m=M();const v=$("#view");
  if(!en||!en.sentences){v.innerHTML=`<div class="blk c-white">${esc(t("no_recap"))}</div>`;return}
  const st=en.stats||{},bf=st.blocked_first_pass??0;

  if(!u){S.live=askCannot(t("ab_why_nomatch"));viewAsk();return}
  S.busy2=true;S.live=null;viewAsk();
  try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),60000);
    const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({match_id:S.mid,question:q,lang:S.lang}),signal:ctl.signal});clearTimeout(to);
    if(r.status===429)S.live={err:"ask_live_cap"};else if(!r.ok)throw new Error(r.status);else S.live=await r.json()}
  catch(e){S.live={err:"ask_live_fail"}}
  clearInterval(stepTimer);S.busy2=false;setEvidence();viewAsk()}

/* ---------- trust ---------- */
const NUMW={two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12};
function nums(s){const r=new Set((s.match(/\d+(?:[.,]\d+)?/g)||[]).map(x=>x.replace(",",".")));(s.toLowerCase().match(/[a-z]+/g)||[]).forEach(w=>{if(NUMW[w])r.add(String(NUMW[w]))});return r}
function ruleCheck(text,ids){const m=M(),fs=ids.map(fact).filter(Boolean),out=[];
  if(!fs.length)return[["no","No valid fact is cited, so there is nothing to check this sentence against."]];
  const ft=fs.map(f=>f.text).join(" "),allowed=new Set();fs.forEach(f=>nums(f.text).forEach(n=>allowed.add(n)));
  const stray=[...nums(text)].filter(n=>!allowed.has(n));if(stray.length)out.push(["no",`The number ${stray.join(", ")} does not appear in the cited facts.`]);
  [m.home,m.away].forEach(tm=>{const first=tm.split(" ")[0],rest=tm.split(" ").slice(1).join(" ");if(new RegExp("\\b"+first+"\\b(?!\\s+"+rest.split(" ")[0]+")").test(text))out.push(["no",`"${first}" is a shortened team name. Use "${tm}".`]);if(text.includes(tm)&&!ft.includes(tm))out.push(["no",`${tm} is not mentioned in the cited facts.`])});
  if(/\b(because|due to|thanks to|deserved|dominated)\b/i.test(text))out.push(["warn","Causal or judging wording. The rule layer cannot decide this; the Judge (a second model call) checks it against the cited facts."]);
  return out.length?out:[["ok","Passes the rule layer: citations exist, every number and name appears in the cited facts."]]}
function viewTrust(){const sc=S.score,en=EN();let a="";
  if(sc){const pct=(100*sc.caught/sc.planted_errors).toFixed(1);a=`<section class="blk c-white"><div class="eyebrow">${esc(t("tr_eyebrow"))}</div><h2 class="headline" style="font-size:clamp(20px,2.6vw,28px)">${esc(t("tr_head"))}</h2>
   <div class="stats"><div class="stat" style="background:var(--lime)"><b>${pct}%</b><span>${esc(t("tr_pct",{a:sc.caught,b:sc.planted_errors}))}</span></div><div class="stat" style="background:var(--sky)"><b>${sc.wrongly_blocked} / ${sc.true_sentences}</b><span>${esc(t("tr_wrongly"))}</span></div></div>
   <div class="eyebrow">${esc(t("tr_kinds"))}</div><div class="rows">${Object.entries(sc.by_kind||{}).map(([k,v])=>`<div class="rw"><span>${esc(t("k_"+k))}</span><div class="bar"><i style="width:${v[1]?100*v[0]/v[1]:0}%"></i></div><span>${v[0]}/${v[1]}</span></div>`).join("")}</div>
   <p class="note">${esc(t("tr_sub",{n:sc.matches,model:sc.model}))}</p><p class="note">${esc(t("tr_data"))}</p></section>`}
  const ag=`<section class="blk c-white"><div class="eyebrow">${esc(t("ag_title"))}</div><ol class="agents">${[1,2,3,4,5].map(i=>`<li><b>${esc(t("ag"+i+"n"))}</b><span>${esc(t("ag"+i+"d"))}</span></li>`).join("")}</ol></section>`;
  let tr="";
  if(en&&en.sentences){const sents=en.sentences,i=Math.min(S.tryIdx,sents.length-1);if(S.tryText==null)S.tryText=sents[i].text;
    tr=`<section class="blk c-white" style="margin-top:var(--gap)"><div class="eyebrow">${esc(t("try_title"))}</div><h2 class="headline" style="font-size:clamp(18px,2.4vw,26px)">${esc(t("try_h"))}</h2>
    <div class="ctrl"><select class="sel" id="ts" aria-label="${esc(t("try_h"))}">${sents.map((s,k)=>`<option value="${k}" ${k===i?"selected":""}>${esc(s.text.slice(0,70))}</option>`).join("")}</select>
    <button class="ghost" id="b1">${esc(t("try_num"))}</button><button class="ghost" id="b2">${esc(t("try_swap"))}</button><button class="ghost" id="b3">${esc(t("try_cause"))}</button><button class="ghost" id="b4">${esc(t("try_reset"))}</button></div>
    <textarea id="tt" rows="3" lang="en" dir="ltr">${esc(S.tryText)}</textarea><p class="note">${esc(t("try_note"))}</p><div id="tv"></div></section>`}
  $("#view").innerHTML=`<div class="two">${a}${ag}</div>${tr}`;
  if(!en||!en.sentences)return;const i=Math.min(S.tryIdx,en.sentences.length-1),ids=en.sentences[i].fact_ids;
  const run=()=>{S.tryText=$("#tt").value;$("#tv").innerHTML=ruleCheck(S.tryText,ids).map(([k,x])=>`<div class="vb ${k}"><b>${esc(t(k==="ok"?"try_ok":k==="no"?"try_no":"try_judge"))}.</b> ${esc(x)}</div>`).join("")};
  $("#tt").oninput=run;run();
  $("#ts").onchange=e=>{S.tryIdx=+e.target.value;S.tryText=null;viewTrust()};
  $("#b1").onclick=()=>{$("#tt").value=$("#tt").value.replace(/\d+(?:\.\d+)?/,n=>String(+n+2));run()};
  $("#b2").onclick=()=>{const a=M().home,b=M().away;$("#tt").value=$("#tt").value.split(a).join("\u0001").split(b).join(a).split("\u0001").join(b);run()};
  $("#b3").onclick=()=>{$("#tt").value=$("#tt").value.replace(/\.?\s*$/,", because they pressed higher up the pitch.");run()};
  $("#b4").onclick=()=>{S.tryText=null;viewTrust()}}

/* ---------- table ---------- */
function viewTable(){const w=S.season.weeks[S.mw-1],m=M();
  $("#view").innerHTML=`<section class="blk c-white tw"><div class="eyebrow">${esc(t("table"))} · ${esc(t("matchweek",{n:S.mw}))}</div><table><tr><th>${esc(t("th_pos"))}</th><th>${esc(t("th_club"))}</th>${["p","w","d","l","gf","ga","gd","pts"].map(k=>`<th>${esc(t("th_"+k))}</th>`).join("")}</tr>${w.table.map(r=>`<tr class="${r.club===m.home||r.club===m.away?"hl":""}"><td>${r.pos}</td><td>${esc(r.club)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf}</td><td>${r.ga}</td><td>${r.gd>0?"+":""}${r.gd}</td><td>${r.pts}</td></tr>`).join("")}</table></section>`}

/* ---------- events ---------- */
function scrollPitch(){const p=$(".pitchp");if(p){const r=p.getBoundingClientRect();if(r.top<0||r.bottom>innerHeight)p.scrollIntoView({block:"nearest",behavior:"smooth"})}}
function pick(sel){S.sel=sel;S.mom=0;if(S.tab==="recap")viewRecap();else if(S.tab==="ask")viewAsk();setEvidence();scrollPitch()}
document.addEventListener("click",e=>{const g=a=>e.target.closest("["+a+"]");let el;
  if(el=g("data-wk")){if(!el.disabled)setWeek(+el.dataset.wk);return}
  if(el=g("data-tab")){S.tab=el.dataset.tab;S.live=null;stop();try{history.replaceState(null,"","#"+S.tab)}catch(x){}shell();return}
  if(el=g("data-mom")){if(!el.disabled){S.mom=+el.dataset.mom;setEvidence()}return}
  if(el=g("data-r")){const i=+el.dataset.r;pick({kind:"r",i,ids:recapIds(i)});return}
  if(el=g("data-a")){const i=+el.dataset.a;pick({kind:"a",i,ids:askSents(S.q)[i].ids});return}
  if(el=g("data-l")){const i=+el.dataset.l,s=(S.live.sentences||[])[i];pick({kind:"l",i,ids:(s&&s.receipts)||[]});return}
  if(el=g("data-ex")){const q=askExamples()[+el.dataset.ex];liveAsk(q);return}
  if(el=g("data-pl")){S.plSide=el.dataset.pl;viewRecap();return}
  if(el=g("data-q")){S.q=+el.dataset.q;S.live=null;const a=askSents(S.q)[0];S.sel=a&&a.ids.length?{kind:"a",i:0,ids:a.ids}:null;S.mom=0;viewAsk();return}
  if(el=g("data-seek")){S.t=+el.dataset.seek;draw();return}
  if(e.target.id==="th"){const h=document.documentElement;h.dataset.mode=h.dataset.mode==="dark"?"light":"dark";store.set("md_mode",h.dataset.mode);shell()}});
document.addEventListener("change",e=>{if(e.target.id==="wk")setWeek(+e.target.value);if(e.target.id==="lg")setLang(e.target.value);
  if(e.target.id==="ms"){S.mid=e.target.value;S.sel=null;S.mom=0;S.q=null;S.live=null;S.t=0;stop();autoSel();shell()}});
document.addEventListener("submit",e=>{if(e.target.id==="af"){e.preventDefault();const q=$("#qi").value.trim();if(q)liveAsk(q)}});
addEventListener("resize",fitRoll);

/* ---------- start ---------- */
(async()=>{try{
  const mode=store.get("md_mode");if(mode==="light"||mode==="dark")document.documentElement.dataset.mode=mode;
  const [season,uiEn,cfg,score,patch]=await Promise.all([J(DATA+"season.json"),J(DATA+"ui/en.json"),J(DATA+"config.json").catch(()=>({})),J(DATA+"scorecard.json").catch(()=>null),J(DATA+"ui_patch.json").catch(()=>({}))]);S.patch=patch;
  if(Array.isArray(cfg.weeks)&&cfg.weeks.length)season.weeks=season.weeks.filter(w=>cfg.weeks.includes(w.n));
  if(Array.isArray(cfg.langs)&&cfg.langs.length){const keep=LANGS.filter(l=>cfg.langs.includes(l[0]));LANGS.splice(0,LANGS.length,...keep)}
  S.season=season;S.uiEn=uiEn;S.ui=uiEn;S.cfg=cfg;S.score=score;S.mw=season.weeks[0].n;
  const h=(location.hash||"").slice(1);if(["recap","replay","ask","trust","table"].includes(h))S.tab=h;
  await loadWeek(S.mw);pickMatch();autoSel();
  let want=store.get("md_lang");if(!want){const n=(navigator.language||"en").slice(0,2).toLowerCase();want=LANGS.find(l=>l[0]===n)?n:"en"}
  if(want!=="en")await setLang(want);else shell();
}catch(e){S.err=e.message;shell()}})();
</script>
