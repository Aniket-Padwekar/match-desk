# Re-runs the offline checks on every push, so the verifier cannot silently get worse.
name: verifier-checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Planted-error scorecard (offline stand-in model, no secrets needed)
        run: python tests/check.py
